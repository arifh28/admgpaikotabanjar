<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pengawas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-tema-hijau shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="#"><i class="fa-solid fa-eye me-2"></i>Panel Pengawas</a>
            <button class="btn btn-sm btn-outline-light ms-auto" onclick="logout()"><i class="fa-solid fa-power-off"></i> Keluar</button>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <div class="card kartu-kustom bg-white border-start border-4 border-warning shadow-sm p-3">
                    <h5 class="mb-0 text-tema-hijau"><i class="fa-solid fa-shield-halved"></i> Selamat Datang, Pengawas Pembina</h5>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card kartu-kustom p-4">
                    <h5 class="fw-bold border-bottom pb-2 mb-3"><i class="fa-solid fa-building-columns text-tema-hijau me-2"></i>Monitoring Sekolah</h5>
                    <ul class="list-group list-group-flush">
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                            Laporan Kinerja Guru
                            <button class="btn btn-sm btn-tema-kuning">Buka</button>
                        </li>
                        <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                            Evaluasi Dokumen Administrasi
                            <button class="btn btn-sm btn-tema-kuning">Buka</button>
                        </li>
                    </ul>
                </div>
            </div>
            <div class="col-md-6">
                 <div class="card kartu-kustom p-4 h-100 d-flex flex-column justify-content-center text-center">
                    <i class="fa-solid fa-file-export fa-4x text-tema-hijau mb-3"></i>
                    <h5 class="fw-bold">Export Data Komprehensif</h5>
                    <p class="text-muted small">Tarik rekapitulasi data format CSV/Excel untuk pelaporan dinas.</p>
                    <button class="btn btn-tema-hijau w-50 mx-auto mt-2">Unduh Format Lengkap</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Fungsi Logout yang Benar
        function logout() {
            // Hapus data sesi di browser
            localStorage.removeItem('user_session');
            
            // Arahkan ke root domain (halaman login utama)
            window.location.href = "/";
        }

        // 2. Proteksi Halaman (Route Guard)
        // Mengecek apakah user benar-benar sudah login saat membuka halaman ini
        document.addEventListener("DOMContentLoaded", function() {
            const sesi = localStorage.getItem('user_session');
            
            // Jika tidak ada sesi (belum login atau sudah logout)
            if (!sesi) {
                // Tendang kembali ke halaman login
                window.location.href = "/";
            } else {
                // Parsing data string JSON kembali menjadi Object Javascript
                const userData = JSON.parse(sesi);
                
                // (Opsional) Tampilkan nama user di elemen HTML yang memiliki id="namaUser"
                const elemenNama = document.getElementById('namaUser');
                if(elemenNama) {
                    elemenNama.innerText = userData.Nama_Lengkap;
                }
            }
        });
    </script>
</body>
</html>
