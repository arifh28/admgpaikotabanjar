<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Guru</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-tema-hijau shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="fa-solid fa-chalkboard-user me-2"></i>Panel Guru</a>
            <button class="btn btn-sm btn-outline-light ms-auto" onclick="logout()"><i class="fa-solid fa-power-off"></i> Keluar</button>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12 mb-4">
                <div class="card kartu-kustom bg-tema-kuning p-3">
                    <h5 class="mb-0"><i class="fa-solid fa-hand-wave"></i> Selamat Datang, <span id="namaUser">Bapak/Ibu Guru</span></h5>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card kartu-kustom h-100 p-4 text-center border-0 shadow-sm">
                    <i class="fa-solid fa-clipboard-list fa-3x text-tema-hijau mb-3"></i>
                    <h5 class="card-title fw-bold">Input Pembiasaan</h5>
                    <p class="text-muted">Rekam catatan sholat dhuha, sholat 5 waktu, dan diniyah siswa hari ini.</p>
                    <button class="btn btn-tema-hijau mt-auto">Mulai Input</button>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card kartu-kustom h-100 p-4 text-center border-0 shadow-sm">
                    <i class="fa-solid fa-file-pdf fa-3x text-tema-hijau mb-3"></i>
                    <h5 class="card-title fw-bold">Generate Dokumen</h5>
                    <p class="text-muted">Cetak laporan harian atau dokumen administrasi kelas otomatis.</p>
                    <button class="btn btn-tema-hijau mt-auto">Buat Dokumen</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Fungsi Logout yang Benar
        function logout() {
            // Hapus data sesi di browser
            localStorage.removeItem('user_session');
            
            // Arahkan ke root domain (halaman login utama)
            window.location.href = "/";
        }

        // 2. Proteksi Halaman (Route Guard)
        // Mengecek apakah user benar-benar sudah login saat membuka halaman ini
        document.addEventListener("DOMContentLoaded", function() {
            const sesi = localStorage.getItem('user_session');
            
            // Jika tidak ada sesi (belum login atau sudah logout)
            if (!sesi) {
                // Tendang kembali ke halaman login
                window.location.href = "/";
            } else {
                // Parsing data string JSON kembali menjadi Object Javascript
                const userData = JSON.parse(sesi);
                
                // (Opsional) Tampilkan nama user di elemen HTML yang memiliki id="namaUser"
                const elemenNama = document.getElementById('namaUser');
                if(elemenNama) {
                    elemenNama.innerText = userData.Nama_Lengkap;
                }
            }
        });
    </script>
</body>
</html>
